<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>층별 이미지 보기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 왼쪽 영역: 이미지 -->
     
    <button id="home-btn">← 뒤로가기</button>
    <div class="content">
      <img id="floor1" src="../제1실습관 안내도(흑백)/제1실습관 1층.png" alt="1층 이미지">
      <img id="floor2" src="../제1실습관 안내도(흑백)/제1실습관 2층.png" alt="2층 이미지">
      <img id="floor3" src="../제1실습관 안내도(흑백)/제1실습관 3층.png" alt="3층 이미지">
      <img id="floor4" src="../제1실습관 안내도(흑백)/제1실습관 4층.png" alt="4층 이미지">
      <img id="floor5" src="../제1실습관 안내도(흑백)/제1실습관 5층.png" alt="5층 이미지">
    </div>

    <!-- 오른쪽 영역: 버튼 (하단 배치) -->
    <div class="sidebar">
      <div class="buttons">
        <button data-target="floor1">1층</button>
        <button data-target="floor2">2층</button>
        <button data-target="floor3">3층</button>
        <button data-target="floor4">4층</button>
        <button data-target="floor5">5층</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
